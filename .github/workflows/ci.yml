name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri links against WebKitGTK on Linux: without these, every cargo
      # step fails with "system library `gdk-3.0` ... was not found".
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install

      - name: Versions in sync
        run: node scripts/check-version.mjs

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Vitest
        run: bun run test

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Generated TS types are up to date
        run: git diff --exit-code -- src/lib/db-types.generated.ts

      # Same entry point as the release (runs the web build too), so problems
      # that only `tauri build` catches, like npm/crate version mismatches,
      # fail here instead of in the release.
      - name: Tauri build (debug, no bundle)
        run: bunx tauri build --debug --no-bundle
